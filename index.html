  <main id="top"><section class="hero container"><div><div class="eyebrow">حاسبة النوم الذكية</div><h1>استيقظ وأنت تشعر <em>بخفة.</em></h1><p class="hero-copy">خطّط لليلة أفضل من خلال الاستيقاظ بين دورات النوم، لا في منتصفها. أدخل وقتك ودع «نَوْم» يقترح لك إيقاعًا يناسب صباحك.</p><div class="hero-badge"><span></span> حساب فوري، بلا تسجيل وبلا تعقيد</div></div><section class="calculator" aria-label="حاسبة النوم"><div class="card-head"><div><p class="card-kicker">خطوتك الأولى نحو صباح أهدأ</p><h2 class="card-title">متى تريد أن تستيقظ؟</h2></div><span class="moon">☾</span></div><div class="tabs"><button class="tab ${n?`active`:``}" data-mode="wake">أريد أن أستيقظ عند</button><button class="tab ${n?``:`active`}" data-mode="sleep">سأنام الآن</button></div><label class="label" for="time-input">${n?`ساعة الاستيقاظ`:`ساعة النوم`}</label><input id="time-input" class="time-input" type="time" value="${n?s():c()}" aria-label="الوقت"/><button class="calculate" id="calculate">${n?`احسب أفضل أوقات نومي`:`احسب أوقات استيقاظي`}</button><div class="result"><div class="result-head"><span class="result-title">${n?`يمكنك النوم في`:`يمكنك الاستيقاظ في`}</span><span class="result-count">الأقرب لإيقاعك أولاً</span></div><div class="results" id="results">${l()}</div></div><div class="info-strip"><span class="info-icon">i</span><span>نحسب متوسط 15 دقيقة للاستغراق في النوم، ودورة تقريبية مدتها 90 دقيقة.</span></div></section></section>
  <section class="section"><div class="container"><div class="section-heading"><div class="eyebrow">كيف تعمل الحاسبة؟</div><h2>ليست الساعات وحدها ما يهم.</h2><p>يمر النوم بمراحل تتكرر على شكل دورات. عندما تستيقظ قرب نهاية دورة، قد تشعر بخفة أكبر. هذه أوقات إرشادية لأن إيقاع كل شخص مختلف.</p></div><div class="cycles"><article class="cycle"><span class="cycle-num">01 / NREM</span><h3>النوم الخفيف</h3><p>انتقال هادئ من اليقظة إلى النوم.</p></article><article class="cycle"><span class="cycle-num">02 / NREM</span><h3>استقرار النوم</h3><p>يهدأ النبض وتبدأ الذاكرة بالترتيب.</p></article><article class="cycle"><span class="cycle-num">03 / NREM</span><h3>النوم العميق</h3><p>مرحلة ترميم الجسم واستعادة الطاقة.</p></article><article class="cycle"><span class="cycle-num">04 / NREM</span><h3>أعمق هدوء</h3><p>يصعب الاستيقاظ خلالها غالبًا.</p></article><article class="cycle"><span class="cycle-num">05 / REM</span><h3>الأحلام</h3><p>نشاط ذهني ومعالجة للمشاعر والذكريات.</p></article></div></div></section>
  <section class="section"><div class="container tips-layout"><div class="section-heading"><div class="eyebrow">طقوس صغيرة، أثر كبير</div><h2>اجعل النوم أسهل على نفسك.</h2><p>الانتظام وجودة البيئة المحيطة بالنوم لا يقلان أهمية عن وقت الذهاب إلى السرير.</p></div><div class="tips"><article class="tip"><span class="tip-icon">◷</span><div><h3>ثبّت موعدك قدر الإمكان</h3><p>حافظ على وقت نوم واستيقاظ متقارب كل يوم، حتى في عطلة نهاية الأسبوع.</p></div></article><article class="tip"><span class="tip-icon">⌁</span><div><h3>خفف الإضاءة والشاشات</h3><p>امنح عينيك وعقلك 30 دقيقة هادئة بعيدًا عن الأجهزة قبل النوم.</p></div></article><article class="tip"><span class="tip-icon">✦</span><div><h3>اجعل الغرفة مريحة</h3><p>بيئة هادئة، مظلمة وباردة قليلًا تساعد جسمك على الاسترخاء.</p></div></article></div></div><div class="container"><div class="disclaimer"><span>!</span><div><strong>تنبيه مهم</strong>هذه الحاسبة أداة إرشادية مبنية على متوسطات تقريبية، وليست تشخيصًا أو بديلًا عن استشارة الطبيب. إذا كنت تعاني من مشاكل نوم مستمرة، تحدث مع مختص.</div></div></div></section></main><footer class="container"><span>© 2026 نَوْم. صُمم ليمنح صباحك بداية أهدأ.</span><span>تصميم: حسين محمد بالحاج</span></footer>`,document.querySelectorAll(`[data-mode]`).forEach(e=>e.addEventListener(`click`,()=>{t.mode=e.dataset.mode,u()})),document.querySelector(`#theme-toggle`).addEventListener(`click`,()=>{t.dark=!t.dark,localStorage.setItem(`nawm-theme`,t.dark?`dark`:`light`),u()}),document.querySelector(`#calculate`).addEventListener(`click`,()=>{document.querySelector(`#results`).innerHTML=l()}),document.querySelector(`#time-input`).addEventListener(`change`,()=>{document.querySelector(`#results`).innerHTML=l()})}u();
